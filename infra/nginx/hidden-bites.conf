upstream hidden_bites_server {
    server 127.0.0.1:8097;
    keepalive 32;
}

server {
    listen 80;
    server_name hidden-bites-api.leed.at;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name hidden-bites-api.leed.at;

    ssl_certificate /etc/letsencrypt/live/hidden-bites-api.leed.at/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hidden-bites-api.leed.at/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;

    location ^~ /api/ {
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_pass http://hidden_bites_server;
    }

    location = /health {
        proxy_pass http://hidden_bites_server/health;
    }

    location / {
        return 404;
    }
}
