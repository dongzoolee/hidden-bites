      <rect x="119" y="85" width="42" height="15" rx="8" class="pink"/><text class="ink" x="127" y="96">ITAEWON</text>
      <rect x="151" y="43" width="66" height="15" rx="8" class="yellow"/><text class="ink" x="157" y="54">MYEONGDONG</text>
