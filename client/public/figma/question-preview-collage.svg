<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1104 336" role="img" aria-labelledby="title desc">
  <title id="title">Hidden Bites question preview collage</title>
  <desc id="desc">Vector preview collage showing an evaluation card, a score badge, a score graph, score controls, and a Seoul dot map.</desc>
  <defs>
    <style>
      .ink{fill:#19120e}.paper{fill:#fff2d9}.paper2{fill:#fff7e8}.orange{fill:#ff5a1f}.yellow{fill:#ffc83d}.green{fill:#3fa56e}.blue{fill:#4c93d7}.pink{fill:#f77da4}.purple{fill:#b67be8}.muted{fill:#6c5c4a}.stroke{stroke:#19120e;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}.body{font-family:Sora,Inter,Arial,sans-serif;font-weight:800}.mono{font-family:"JetBrains Mono",Menlo,monospace;font-weight:800}.display{font-family:"AirbnbCereal_W_XBd",Sora,Arial,sans-serif;font-weight:900}
    </style>
    <filter id="shadow" x="-15%" y="-18%" width="130%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="7" stdDeviation="0" flood-color="#19120e" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="1104" height="336" fill="#ff5a1f"/>
