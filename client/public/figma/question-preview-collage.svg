    <text class="display yellow" x="396" y="58" font-size="39">4.93</text>
    <text class="display yellow" x="452" y="58" font-size="19">*</text>
    <line x1="20" x2="452" y1="101" y2="101" stroke="#45362e" stroke-width="1.4" stroke-dasharray="5 5"/>
    <g transform="translate(20 118)">
