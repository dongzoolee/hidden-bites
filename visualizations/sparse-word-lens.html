<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hidden Bites Sparse Word Lens</title>
    <link rel="icon" href="data:,">
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f8f4;
        --surface: #ffffff;
        --surface-soft: #eef1e8;
        --ink: #191916;
        --muted: #6b6f66;
        --line: #d8ddd0;
        --accent: #d9542b;
        --accent-2: #157a6e;
        --accent-3: #3d5a80;
        --heat-0: #edf0e8;
        --shadow: 0 16px 46px rgba(32, 36, 30, 0.12);
        --radius: 8px;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100svh;
        background: var(--bg);
        color: var(--ink);
      }

      button,
      input {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .app-shell {
        min-height: 100svh;
        display: grid;
        grid-template-rows: auto 1fr;
      }

      .topbar {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 24px;
        padding: 24px 28px 18px;
        border-bottom: 1px solid var(--line);
        background: rgba(247, 248, 244, 0.94);
        backdrop-filter: blur(10px);
        position: sticky;
        top: 0;
        z-index: 20;
      }

      .brand {
        display: flex;
        align-items: baseline;
        gap: 14px;
        min-width: 0;
      }

      .brand h1 {
        margin: 0;
        font-size: clamp(28px, 3vw, 48px);
        line-height: 0.95;
        letter-spacing: 0;
      }

      .brand span {
        color: var(--muted);
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .summary-strip {
        display: grid;
        grid-template-columns: repeat(4, auto);
        align-items: end;
        gap: 18px;
      }

      .metric {
        min-width: 74px;
      }

      .metric strong {
        display: block;
        font-size: 24px;
        line-height: 1;
      }

      .metric span {
        display: block;
        margin-top: 6px;
        color: var(--muted);
        font-size: 12px;
      }

      .workspace {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 338px;
        min-height: 0;
      }

      .recommendations {
        padding: 24px;
        background: var(--surface);
        min-width: 0;
      }

      .recommendations {
        border-left: 1px solid var(--line);
      }

      .main-stage {
        min-width: 0;
        padding: 24px;
        display: grid;
        grid-template-rows: auto auto auto minmax(0, 1fr);
        gap: 18px;
      }

      .section-kicker {
        margin: 0 0 10px;
        color: var(--muted);
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        min-height: 28px;
        border-radius: 999px;
        border: 1px solid var(--line);
        padding: 5px 9px;
        background: var(--surface);
        color: var(--muted);
        font-size: 12px;
      }

      .chip.hot {
        border-color: rgba(217, 84, 43, 0.34);
        color: var(--accent);
        background: #fff1e9;
      }

      .evidence {
        margin: 0;
        color: var(--ink);
        font-size: 14px;
        line-height: 1.55;
      }

      .stage-header {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 16px;
        align-items: end;
      }

      .stage-title h2 {
        margin: 0;
        font-size: clamp(22px, 2.4vw, 34px);
        letter-spacing: 0;
      }

      .stage-title p {
        margin: 8px 0 0;
        color: var(--muted);
        line-height: 1.5;
        max-width: 760px;
      }

      .lens-reveal {
        display: grid;
        gap: 10px;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        padding: 22px 0;
      }

      .reveal-topline {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 18px;
      }

      .restaurant-name {
        margin: 0;
        font-size: clamp(42px, 7vw, 92px);
        line-height: 0.92;
        letter-spacing: 0;
        overflow-wrap: anywhere;
        word-break: keep-all;
      }

      .reveal-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .keyword-rail {
        display: flex;
        gap: 10px;
        overflow-x: auto;
        padding: 4px 2px 12px;
        scrollbar-width: thin;
      }

      .keyword-button {
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        min-height: 50px;
        min-width: 142px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 12px 14px;
        background: var(--surface);
        color: var(--ink);
        text-align: left;
        transition: transform 160ms ease, border-color 160ms ease, background 160ms ease, box-shadow 160ms ease;
      }

      .keyword-button:hover,
      .keyword-button:focus-visible,
      .keyword-button.is-active {
        transform: translateY(-2px);
        border-color: rgba(217, 84, 43, 0.5);
        background: #fff4eb;
        box-shadow: 0 10px 24px rgba(32, 36, 30, 0.1);
        outline: none;
      }

      .keyword-button strong {
        font-size: 14px;
        line-height: 1.25;
        word-break: keep-all;
      }

      .legend {
        display: flex;
        align-items: center;
        gap: 9px;
        color: var(--muted);
        font-size: 12px;
      }

      .legend-ramp {
        width: 112px;
        height: 10px;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--heat-0), #f7d8a6, #d9542b);
        border: 1px solid rgba(25, 25, 22, 0.08);
      }

      .heatmap-shell {
        min-height: 0;
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .heatmap {
        min-width: 960px;
      }

      .heat-row {
        display: grid;
        grid-template-columns: 230px repeat(9, minmax(74px, 1fr));
        min-height: 58px;
        border-bottom: 1px solid var(--line);
      }

      .heat-row:last-child {
        border-bottom: 0;
      }

      .heat-head {
        position: sticky;
        top: 0;
        z-index: 2;
        min-height: 62px;
        background: #fbfcf7;
      }

      .heat-label,
      .restaurant-label {
        display: flex;
        align-items: center;
        padding: 11px 12px;
        border-right: 1px solid var(--line);
      }

      .heat-label {
        position: sticky;
        left: 0;
        z-index: 3;
        background: #fbfcf7;
        font-weight: 700;
      }

      .restaurant-label {
        justify-content: center;
        text-align: center;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.2;
        writing-mode: vertical-rl;
        transform: rotate(180deg);
      }

      .term-cell {
        position: sticky;
        left: 0;
        z-index: 1;
        display: flex;
        align-items: center;
        min-width: 0;
        padding: 10px 12px;
        border-right: 1px solid var(--line);
        background: var(--surface);
      }

      .term-button {
        width: 100%;
        border: 0;
        padding: 0;
        background: transparent;
        text-align: left;
        color: var(--ink);
        display: grid;
        gap: 3px;
      }

      .term-button strong {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: normal;
        line-height: 1.25;
        font-size: 14px;
      }

      .term-button span {
        color: var(--muted);
        font-size: 11px;
      }

      .heat-row.is-active .term-cell {
        background: #fff4eb;
      }

      .heat-row.is-active .term-button strong {
        color: var(--accent);
      }

      .heat-cell {
        min-height: 50px;
        border: 0;
        border-right: 1px solid var(--line);
        background: var(--heat-0);
        color: var(--ink);
        display: grid;
        place-items: center;
        position: relative;
        transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
      }

      .heat-cell:last-child {
        border-right: 0;
      }

      .heat-cell:hover,
      .heat-cell.is-selected {
        transform: scale(1.04);
        z-index: 4;
        box-shadow: 0 0 0 2px rgba(25, 25, 22, 0.82), 0 12px 28px rgba(25, 25, 22, 0.16);
      }

      .heat-value {
        font-size: 11px;
        font-weight: 800;
        opacity: 0;
        transition: opacity 160ms ease;
      }

      .heat-cell:hover .heat-value,
      .heat-cell.is-selected .heat-value {
        opacity: 1;
      }

      .rec-list {
        display: grid;
        gap: 14px;
      }

      .rec-item {
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 14px;
        background: var(--surface);
      }

      .rec-top {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
      }

      .rec-top h3 {
        margin: 0;
        font-size: 18px;
        line-height: 1.2;
      }

      .rec-top span {
        color: var(--accent);
        font-size: 12px;
        font-weight: 800;
      }

      .bar {
        height: 9px;
        margin: 12px 0;
        border-radius: 999px;
        background: var(--surface-soft);
        overflow: hidden;
      }

      .bar-fill {
        height: 100%;
        width: 0;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--accent-2), var(--accent));
        transition: width 220ms ease;
      }

      .rec-snippet {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
      }

      .fingerprint {
        display: grid;
        gap: 10px;
        margin-top: 18px;
      }

      .fingerprint-row {
        display: grid;
        grid-template-columns: 90px minmax(0, 1fr) 42px;
        align-items: center;
        gap: 10px;
        font-size: 12px;
      }

      .fingerprint-row span:first-child {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .mini-bar {
        height: 8px;
        border-radius: 999px;
        background: var(--surface-soft);
        overflow: hidden;
      }

      .mini-bar i {
        display: block;
        height: 100%;
        border-radius: inherit;
        background: var(--accent-3);
      }

      .empty {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
      }

      .fade-in {
        animation: fadeIn 260ms ease both;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 1160px) {
        .workspace {
          grid-template-columns: 1fr;
        }

        .recommendations {
          grid-column: 1 / -1;
          border-left: 0;
          border-top: 1px solid var(--line);
        }
      }

      @media (max-width: 760px) {
        .topbar {
          position: static;
          grid-template-columns: 1fr;
          padding: 20px;
        }

        .brand {
          align-items: flex-start;
          flex-direction: column;
          gap: 8px;
        }

        .summary-strip {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .workspace {
          grid-template-columns: 1fr;
        }

        .recommendations,
        .main-stage {
          padding: 18px;
        }

        .recommendations {
          border: 0;
          border-bottom: 1px solid var(--line);
        }

        .stage-header {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <h1>Hidden Bites</h1>
          <span>Sparse Word Lens</span>
        </div>
        <div class="summary-strip" aria-label="Dataset summary">
          <div class="metric"><strong>4,091</strong><span>reviews</span></div>
          <div class="metric"><strong>10</strong><span>places</span></div>
          <div class="metric"><strong>9</strong><span>lens words</span></div>
          <div class="metric"><strong>13.7k</strong><span>word links</span></div>
        </div>
      </header>

      <main class="workspace">
        <section class="main-stage">
          <div class="stage-header">
            <div class="stage-title">
              <h2>Restaurant signatures by sparse expression</h2>
              <p id="stageSubtitle">Rare review language surfaces places for a specific need, not just places with more reviews.</p>
            </div>
            <div class="legend">
              <span>low</span>
              <span class="legend-ramp"></span>
              <span>signature</span>
            </div>
          </div>
          <section class="lens-reveal" aria-label="Focused restaurant">
            <div class="reveal-topline">
              <p class="section-kicker">Focused restaurant</p>
              <div class="reveal-meta" id="activeMeta"></div>
            </div>
            <h2 class="restaurant-name" id="restaurantRevealName">어반플랜트 합정</h2>
            <p class="evidence" id="activeEvidence"></p>
          </section>
          <div class="keyword-rail" id="keywordRail" aria-label="Sparse keyword lens"></div>
          <div class="heatmap-shell" aria-label="Sparse expression heatmap">
            <div class="heatmap" id="heatmap"></div>
          </div>
        </section>

        <aside class="recommendations">
          <p class="section-kicker">Recommendation</p>
          <div class="rec-list" id="recommendationList"></div>
          <div class="fingerprint" id="fingerprint"></div>
        </aside>
      </main>
    </div>

    <script>
      const restaurants = [
        { id: "ttobagi", name: "또바기", type: "한식" },
        { id: "tanghua", name: "탕화쿵푸마라탕", type: "마라탕" },
        { id: "gwangyeon", name: "광어연어", type: "횟집" },
        { id: "pallo", name: "팔로피자", type: "피자" },
        { id: "urban", name: "어반플랜트 합정", type: "브런치" },
        { id: "motherinlaw", name: "마더린러 베이글", type: "베이글" },
        { id: "brotart", name: "브로트아트", type: "베이커리" },
        { id: "gyukatsu", name: "규카츠정 성수점", type: "규카츠" },
        { id: "dowon", name: "대진 도원참치", type: "참치" }
      ];

      const contexts = [
        { id: "all", label: "전체" },
        { id: "comfort", label: "집밥" },
        { id: "daily", label: "일상" },
        { id: "bread", label: "빵" },
        { id: "service", label: "서비스" }
      ];

      const terms = [
        { id: "custom-order", label: "주문제작을 잘해줘요", context: "service", count: 1, lift: 8.2, tone: "positive", snippet: "사장님도 친절하시고 음식도 맛있고 인테리어도 예뻐요. 네이버 키워드: 주문제작을 잘해줘요.", scores: { urban: 153 } },
        { id: "dance-after", label: "댄스끝나고 갑니다", context: "daily", count: 1, lift: 17.3, tone: "positive", snippet: "아이들과 댄스끝나면 매번갑니다.", scores: { tanghua: 132 } },
        { id: "one-shot-done", label: "원샷했어요", context: "daily", count: 1, lift: 17.3, tone: "positive", snippet: "너무 맛있어서 원샷했어요. 깨끗하고 청결해서 좋아요.", scores: { tanghua: 126 } },
        { id: "pugun", label: "푸근하다", context: "comfort", count: 1, lift: 43.1, tone: "positive", snippet: "이곳은 집밥처럼 푸근하고 맛있습니다.", scores: { ttobagi: 214 } },
        { id: "sonmat-not-jonmat", label: "존맛X 손맛O", context: "comfort", count: 2, lift: 21.5, tone: "positive", snippet: "요즘 보기 드문 당산의 백반 전문점. 시원 칼칼하게 잘 먹고 갑니다. 친절하시고 손맛 좋아요.", scores: { ttobagi: 255, gyukatsu: 72 } },
        { id: "urgent-training", label: "직원 교육 시급", context: "service", count: 2, lift: 8.2, tone: "caution", snippet: "피자는 정말 맛있어서 더 아쉽습니다. 사장님, 직원 교육이 시급해 보입니다.", scores: { pallo: 127 } },
        { id: "irreplaceable", label: "대체불가", context: "bread", count: 1, lift: 8.2, tone: "positive", snippet: "수시로 들르는 참새방앗간. 대체불가한 맛이에요.", scores: { motherinlaw: 171 } },
        { id: "praise", label: "칭찬일색", context: "service", count: 2, lift: 8.2, tone: "positive", snippet: "신선하고 좋은 부위 맛있다고 칭찬일색이예요. 그래서 어깨가 으쓱했답니다.", scores: { dowon: 142 } },
        { id: "one-shot-token", label: "원샷", context: "daily", count: 1, lift: 17.3, tone: "positive", snippet: "너무 맛있어서 원샷했어요. 깨끗하고 청결해서 좋아요.", scores: { tanghua: 118 } }
      ];

      const state = {
        activeId: "custom-order"
      };

      const heatmap = document.getElementById("heatmap");
      const keywordRail = document.getElementById("keywordRail");
      const restaurantRevealName = document.getElementById("restaurantRevealName");
      const activeMeta = document.getElementById("activeMeta");
      const activeEvidence = document.getElementById("activeEvidence");
      const recommendationList = document.getElementById("recommendationList");
      const fingerprint = document.getElementById("fingerprint");
      const stageSubtitle = document.getElementById("stageSubtitle");

      const maxScore = Math.max(...terms.flatMap((term) => Object.values(term.scores)));

      function filteredTerms() {
        return terms;
      }

      function activeTerm() {
        return terms.find((term) => term.id === state.activeId) || filteredTerms()[0] || terms[0];
      }

      function heatColor(score) {
        if (!score) {
          return "#edf0e8";
        }
        const value = Math.min(1, score / maxScore);
        const hue = 42 - value * 28;
        const sat = 55 + value * 24;
        const light = 92 - value * 38;
        return `hsl(${hue} ${sat}% ${light}%)`;
      }

      function readableScore(score) {
        return score ? Math.round(score).toString() : "";
      }

      function contextLabel(id) {
        return contexts.find((context) => context.id === id)?.label || id;
      }

      function restaurantName(id) {
        return restaurants.find((restaurant) => restaurant.id === id)?.name || id;
      }

      function syncActiveTerm() {
        const list = filteredTerms();
        if (!list.some((term) => term.id === state.activeId)) {
          state.activeId = list[0].id;
        }
      }

      function renderActiveTerm() {
        const term = activeTerm();
        const ranked = restaurants
          .map((restaurant) => ({ restaurant, score: term.scores[restaurant.id] || 0 }))
          .sort((a, b) => b.score - a.score);
        const best = ranked[0];
        restaurantRevealName.textContent = best.restaurant.name;
        activeMeta.innerHTML = "";
        const toneChip = term.tone === "caution" ? "caution signal" : "positive signal";
        [
          term.label,
          `${contextLabel(term.context)} context`,
          `${term.count} mentions`,
          `lift ${term.lift.toFixed(1)}x`,
          toneChip
        ].forEach((label, index) => {
          const chip = document.createElement("span");
          chip.className = `chip${index === 0 || index === 4 ? " hot" : ""}`;
          chip.textContent = label;
          activeMeta.appendChild(chip);
        });
        activeEvidence.textContent = term.snippet;
      }

      function activateTerm(termId) {
        state.activeId = termId;
        render();
      }

      function renderKeywordRail() {
        keywordRail.innerHTML = "";
        filteredTerms().forEach((term) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = `keyword-button${term.id === state.activeId ? " is-active" : ""}`;
          button.innerHTML = `<strong>${term.label}</strong>`;
          button.addEventListener("mouseenter", () => activateTerm(term.id));
          button.addEventListener("focus", () => activateTerm(term.id));
          button.addEventListener("click", () => activateTerm(term.id));
          keywordRail.appendChild(button);
        });
      }

      function renderHeatmap() {
        const list = filteredTerms();
        const rows = list.slice(0, 24);
        heatmap.innerHTML = "";
        const header = document.createElement("div");
        header.className = "heat-row heat-head";
        const first = document.createElement("div");
        first.className = "heat-label";
        first.textContent = "Sparse word";
        header.appendChild(first);
        restaurants.forEach((restaurant) => {
          const label = document.createElement("div");
          label.className = "restaurant-label";
          label.textContent = restaurant.name;
          header.appendChild(label);
        });
        heatmap.appendChild(header);
        rows.forEach((term) => {
          const row = document.createElement("div");
          row.className = `heat-row${term.id === state.activeId ? " is-active" : ""}`;
          const labelCell = document.createElement("div");
          labelCell.className = "term-cell";
          const labelButton = document.createElement("button");
          labelButton.type = "button";
          labelButton.className = "term-button";
          labelButton.innerHTML = `<strong>${term.label}</strong><span>${contextLabel(term.context)} · ${term.count} mentions</span>`;
          labelButton.addEventListener("click", () => {
            state.activeId = term.id;
            render();
          });
          labelCell.appendChild(labelButton);
          row.appendChild(labelCell);
          restaurants.forEach((restaurant) => {
            const score = term.scores[restaurant.id] || 0;
            const cell = document.createElement("button");
            cell.type = "button";
            cell.className = `heat-cell${term.id === state.activeId && score > 0 ? " is-selected" : ""}`;
            cell.style.background = heatColor(score);
            cell.setAttribute("aria-label", `${term.label} at ${restaurant.name}: ${readableScore(score) || "none"}`);
            cell.innerHTML = `<span class="heat-value">${readableScore(score)}</span>`;
            cell.addEventListener("click", () => {
              state.activeId = term.id;
              render();
            });
            row.appendChild(cell);
          });
          heatmap.appendChild(row);
        });
        if (!rows.length) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.style.padding = "18px";
          empty.textContent = "No sparse expressions available.";
          heatmap.appendChild(empty);
        }
      }

      function renderRecommendations() {
        const term = activeTerm();
        const ranked = restaurants
          .map((restaurant) => ({ restaurant, score: term.scores[restaurant.id] || 0 }))
          .filter((item) => item.score > 0)
          .sort((a, b) => b.score - a.score)
          .slice(0, 3);
        recommendationList.innerHTML = "";
        ranked.forEach((item, index) => {
          const confidence = Math.min(97, Math.round(58 + (item.score / maxScore) * 39));
          const scoreLabel = term.tone === "caution" ? "caution" : "match";
          const node = document.createElement("article");
          node.className = "rec-item fade-in";
          node.innerHTML = `
            <div class="rec-top">
              <h3>${index + 1}. ${item.restaurant.name}</h3>
              <span>${confidence}% ${scoreLabel}</span>
            </div>
            <div class="bar"><div class="bar-fill" style="width: ${(item.score / maxScore) * 100}%"></div></div>
            <p class="rec-snippet">${term.snippet}</p>
          `;
          recommendationList.appendChild(node);
        });
        if (!ranked.length) {
          recommendationList.innerHTML = `<p class="empty">No restaurant clears the current sparse lens.</p>`;
        }
        renderFingerprint(ranked[0]?.restaurant.id);
      }

      function renderFingerprint(restaurantId) {
        fingerprint.innerHTML = "";
        if (!restaurantId) {
          return;
        }
        const title = document.createElement("p");
        title.className = "section-kicker";
        title.textContent = `${restaurantName(restaurantId)} fingerprint`;
        fingerprint.appendChild(title);
        const rows = terms
          .map((term) => ({ term, score: term.scores[restaurantId] || 0 }))
          .filter((item) => item.score > 0)
          .sort((a, b) => b.score - a.score)
          .slice(0, 5);
        rows.forEach((item) => {
          const row = document.createElement("div");
          row.className = "fingerprint-row";
          row.innerHTML = `
            <span>${item.term.label}</span>
            <span class="mini-bar"><i style="width: ${(item.score / maxScore) * 100}%"></i></span>
            <span>${Math.round(item.score)}</span>
          `;
          fingerprint.appendChild(row);
        });
      }

      function renderSubtitle() {
        const term = activeTerm();
        const topRestaurant = Object.entries(term.scores).sort((a, b) => b[1] - a[1])[0][0];
        if (term.tone === "caution") {
          stageSubtitle.textContent = `${term.label} flags ${restaurantName(topRestaurant)} as a rare caution phrase, while the heatmap keeps it comparable with positive signals.`;
          return;
        }
        stageSubtitle.textContent = `${term.label} points to ${restaurantName(topRestaurant)} through a rare review phrase, then the heatmap shows whether that phrase travels to other places.`;
      }

      function render() {
        syncActiveTerm();
        renderActiveTerm();
        renderKeywordRail();
        renderSubtitle();
        renderHeatmap();
        renderRecommendations();
      }

      render();
    </script>
  </body>
</html>
