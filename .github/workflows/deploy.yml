name: Deploy Job

on:
  workflow_call:
    inputs:
      deploy_client:
        description: Deploy client
        required: false
        type: boolean
        default: false

jobs:
  deploy_client:
    if: ${{ inputs.deploy_client == true }}
    runs-on: ubicloud-standard-2
    steps:
      - name: Checkout deploy scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/cloudfront
            .github/scripts

      - name: Download client artifact
        uses: actions/download-artifact@v4
        with:
          name: client-build
          path: dist

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-northeast-2
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Ensure client infrastructure
        run: .github/scripts/ensure-hidden-bites-client-infra.sh
        env:
          AWS_REGION: ap-northeast-2
          HIDDEN_BITES_BUCKET_NAME: hidden-bites-production
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}

      - name: Deploy client to S3
        run: |
          set -eu
          CLIENT_S3_URI="s3://hidden-bites-production/client-build"

          aws s3 sync dist "$CLIENT_S3_URI" \
            --delete \
            --exclude "_next/static/*" \
            --exclude "*.html" \
            --cache-control "public,max-age=300,must-revalidate"

          if [ -d dist/_next/static ]; then
            aws s3 sync dist/_next/static "$CLIENT_S3_URI/_next/static" \
              --cache-control "public,max-age=31536000,immutable"
          fi

          aws s3 cp dist "$CLIENT_S3_URI" \
            --recursive \
            --exclude "*" \
            --include "*.html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html; charset=utf-8"

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"
