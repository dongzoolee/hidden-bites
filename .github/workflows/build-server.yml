name: Build Server Job

on:
  workflow_call:
    outputs:
      registry:
        description: ECR registry URL
        value: ${{ jobs.build_server.outputs.registry }}

jobs:
  build_server:
    runs-on: ubicloud-standard-2
    outputs:
      registry: ${{ steps.login-ecr.outputs.registry }}
    steps:
      - name: Checkout server
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            server
            datasets/derived
            .dockerignore

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
          cache: yarn
          cache-dependency-path: server/yarn.lock

      - name: Install dependencies
        run: corepack enable && yarn install --frozen-lockfile
        working-directory: server

      - name: Check server
        run: yarn type-check && yarn lint && yarn test && yarn build
        working-directory: server

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-northeast-2
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Ensure ECR repository
        env:
          REPOSITORY: hidden-bites-server
        run: |
          aws ecr describe-repositories --repository-names "$REPOSITORY" >/dev/null 2>&1 \
            || aws ecr create-repository --repository-name "$REPOSITORY" >/dev/null

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push server image
        uses: docker/build-push-action@v6
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: hidden-bites-server
          IMAGE_TAG: ${{ github.sha }}
        with:
          context: .
          file: ./server/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPOSITORY }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=hidden-bites-server
          cache-to: type=gha,mode=max,scope=hidden-bites-server
