name: Build Client Job

on:
  workflow_call:

jobs:
  build_client:
    runs-on: ubicloud-standard-2
    steps:
      - name: Checkout client
        uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /client/
            /.github/cloudfront/
            /datasets/derived/hb-score-web-report.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"

      - name: Enable pnpm via corepack
        run: |
          corepack enable
          echo "COREPACK_ENABLE_DOWNLOAD_PROMPT=0" >> "$GITHUB_ENV"
          COREPACK_ENABLE_DOWNLOAD_PROMPT=0 pnpm --version
        working-directory: client

      - name: Restore pnpm store cache
        uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: client

      - name: Validate CloudFront function
        run: node .github/cloudfront/viewer-request.test.js

      - name: Check client
        run: pnpm typecheck && pnpm lint && pnpm test
        working-directory: client

      - name: Build client
        run: pnpm build:web
        working-directory: client
        env:
          NEXT_PUBLIC_KAKAO_MAP_API_KEY: ${{ secrets.KAKAO_MAP_API_KEY }}

      - name: Upload client artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-build
          path: client/client-build
          if-no-files-found: error
